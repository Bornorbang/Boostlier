services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: temp_number
      MYSQL_USER: temp_number
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set LOCAL_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
